<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze Robot — Control</title>
<style>
  /* ---- Light theme, drafting-paper feel ----
     The maze is a hand-drawn plan, so the dashboard reads like drafting paper:
     warm off-white ground, ink-navy structure, one teal for the live robot,
     warm coral for the goal. Walls are the subject, so they get the ink. */
  :root{
    --paper:#f7f5ef; --card:#ffffff; --line:#e2ddd0;
    --ink:#1f2a33; --ink-dim:#8a8577; --grid:#ece7db;
    --wall-faint:#aca591; --wall:#1f2a33;
    --robot:#0e9e8e; --robot-soft:#0e9e8e22;
    --explored:#eef6f4; --goal:#e5674f; --start:#e9e3d2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1000px 500px at 80% -15%, #fffdf7 0%, transparent 55%),var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px;
  }
  .shell{width:100%;max-width:1060px}
  header{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:22px;flex-wrap:wrap;gap:8px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;font-size:21px;letter-spacing:.5px;margin:0}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--robot);
    box-shadow:0 0 0 3px var(--robot-soft);align-self:center;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .conn{font-size:12px;color:var(--ink-dim)}
  .conn b{color:var(--robot);font-weight:600}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
    box-shadow:0 1px 0 #00000008,0 6px 20px #1f2a3308}
  .card h2{font-family:"Space Grotesk",system-ui,sans-serif;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--ink-dim);margin:0 0 14px;font-weight:600}
  .maze-wrap{display:flex;justify-content:center}
  #maze{width:100%;max-width:460px;aspect-ratio:1/1}
  .cell-bg{fill:var(--card)}
  .cell-explored{fill:var(--explored)}
  .cell-start{fill:var(--start)}
  .cell-goal{fill:var(--goal);opacity:.16}
  .sep{stroke:var(--grid);stroke-width:1}
  .wall{stroke:var(--wall-faint);stroke-width:3.5;stroke-linecap:round;transition:stroke .3s,stroke-width .3s}
  .wall.on{stroke:var(--wall);stroke-width:6}
  .robot{fill:var(--robot);transition:cx .25s ease,cy .25s ease}
  .robot-ring{fill:none;stroke:var(--robot);stroke-width:2;opacity:.35}
  .robot-heading{stroke:#fff;stroke-width:2.5;stroke-linecap:round}
  .label{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px}
  .label.s{fill:var(--ink-dim)} .label.e{fill:var(--goal)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat .k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim)}
  .stat .v{font-size:25px;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--ink-dim)}
  .msg{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--robot);
    border-radius:8px;padding:12px 14px;font-size:14px;min-height:44px;display:flex;align-items:center;gap:10px}
  .msg.alert{border-left-color:var(--goal);color:#a23b2a;background:#fdf1ee}
  .msg .tick{color:var(--ink-dim);font-size:11px}
  .algos{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .algo{display:flex;align-items:center;justify-content:space-between;background:var(--paper);
    border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px 15px;cursor:pointer;
    font:inherit;font-size:14px;transition:border-color .15s,background .15s,transform .05s;text-align:left}
  .algo:hover{border-color:var(--robot)}
  .algo:active{transform:translateY(1px)}
  .algo.sel{border-color:var(--robot);background:#eafaf7;color:#0b7d70}
  .algo .tag{font-size:10px;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase}
  .algo.sel .tag{color:#0b7d70}
  /* mid-run the algorithm is latched - a run finishes as it started */
  .algo.locked{opacity:.45;cursor:not-allowed}
  .algo.locked:hover{border-color:var(--line)}
  .runbar{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border-radius:10px;padding:13px;font:inherit;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;font-weight:600;background:var(--robot);color:#fff;border:1px solid transparent}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn:active{transform:translateY(1px)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--ink-dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid #0002}
  .dims{margin-top:10px;font-size:11px;color:var(--ink-dim);letter-spacing:.3px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="dot"></span><h1>MAZE ROBOT · CONTROL</h1></div>
    <div class="conn">link <b id="conn">simulated</b></div>
  </header>
  <div class="grid">
    <div class="card">
      <h2>Live Map · 4×4</h2>
      <div class="maze-wrap"><svg id="maze" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="legend">
        <span><i style="background:var(--robot)"></i>robot</span>
        <span><i style="background:var(--explored)"></i>explored</span>
        <span><i style="background:var(--wall-faint)"></i>undiscovered wall</span>
        <span><i style="background:var(--wall)"></i>found wall</span>
        <span><i style="background:var(--goal)"></i>goal</span>
      </div>
      <div class="dims">Cell 25×25 cm · wall 3 cm · pitch 28 cm/cell</div>
    </div>
    <div>
      <div class="card" style="margin-bottom:22px">
        <h2>Telemetry</h2>
        <div class="stats">
          <div class="stat"><div class="k">Cells explored</div><div class="v" id="explored">0<small>/16</small></div></div>
          <div class="stat"><div class="k">Time to goal</div><div class="v" id="timer">0.0<small>s</small></div></div>
        </div>
        <div class="msg" id="msg"><span class="tick">▲</span><span id="msgtext">Standing by.</span></div>
      </div>
      <div class="card">
        <h2>Algorithm</h2>
        <div class="algos" id="algos">
          <button class="algo sel" data-algo="floodfill"><span>Flood fill</span><span class="tag">optimal</span></button>
          <button class="algo" data-algo="lefthand"><span>Left-hand rule</span><span class="tag">wall follow</span></button>
          <button class="algo" data-algo="astar"><span>A*</span><span class="tag">heuristic</span></button>
        </div>
        <div class="runbar">
          <button class="btn" id="run">Run</button>
          <button class="btn ghost" id="reset">Reset</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
// ===== FIXED MAZE (from your hand-drawn map) =====
// Keyed "row,col"; row 0 = bottom, row 3 = top. Symmetric; border walls included.
const MAZE={"0,0":["E","S","W"],"0,1":["S","W"],"0,2":["E","S"],"0,3":["E","S","W"],"1,0":["W"],"1,1":["E","N"],"1,2":["W"],"1,3":["E","N"],"2,0":["N","W"],"2,1":["E","S"],"2,2":["E","W"],"2,3":["E","S","W"],"3,0":["N","S","W"],"3,1":["E","N"],"3,2":["N","W"],"3,3":["E","N"]};
const START=[3,0], GOAL=[0,3];
const N=4, CELL=420/N, svg=document.getElementById('maze');
function hasWall(r,c,side){const w=MAZE[`${r},${c}`];return w&&w.includes(side);}

function draw(state){
  const {pos,heading,discovered,explored,elapsed,message}=state;
  const seen=new Set(discovered||[]); let s='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=c*CELL,y=(N-1-r)*CELL; let cls='cell-bg';
    if(r===START[0]&&c===START[1])cls='cell-start';
    if(seen.has(`${r},${c}`))cls='cell-explored';
    if(r===GOAL[0]&&c===GOAL[1])s+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" class="cell-goal"/>`;
    s+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" class="${cls}"/>`;
    s+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" class="sep" fill="none"/>`;
  }
  const line=(on,x1,y1,x2,y2)=>`<line class="wall ${on?'on':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=c*CELL,y=(N-1-r)*CELL,bright=seen.has(`${r},${c}`);
    if(hasWall(r,c,'N'))s+=line(bright,x,y,x+CELL,y);
    if(hasWall(r,c,'S'))s+=line(bright,x,y+CELL,x+CELL,y+CELL);
    if(hasWall(r,c,'W'))s+=line(bright,x,y,x,y+CELL);
    if(hasWall(r,c,'E'))s+=line(bright,x+CELL,y,x+CELL,y+CELL);
  }
  s+=`<text class="label s" x="${START[1]*CELL+10}" y="${(N-1-START[0])*CELL+26}">S</text>`;
  s+=`<text class="label e" x="${GOAL[1]*CELL+CELL-24}" y="${(N-1-GOAL[0])*CELL+CELL-12}">E</text>`;
  if(pos){
    const cx=pos[1]*CELL+CELL/2,cy=(N-1-pos[0])*CELL+CELL/2;
    s+=`<circle class="robot-ring" cx="${cx}" cy="${cy}" r="${CELL*0.34}"/>`;
    s+=`<circle class="robot" cx="${cx}" cy="${cy}" r="${CELL*0.22}"/>`;
    const d={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]}[heading]||[0,-1];
    s+=`<line class="robot-heading" x1="${cx}" y1="${cy}" x2="${cx+d[0]*CELL*0.22}" y2="${cy+d[1]*CELL*0.22}"/>`;
  }
  svg.innerHTML=s;
  document.getElementById('explored').innerHTML=`${explored}<small>/16</small>`;
  document.getElementById('timer').innerHTML=`${(elapsed||0).toFixed(1)}<small>s</small>`;
  const msg=document.getElementById('msg');
  document.getElementById('msgtext').textContent=message||'Running…';
  msg.classList.toggle('alert',/wall/i.test(message||''));

  // The algorithm is latched for the whole run: show which one is executing
  // and stop the user picking another until the run ends or is reset.
  locked=!!state.running;
  const shown=state.active_algo||state.algo;
  if(shown&&shown!==selected)markSelected(shown);
  document.querySelectorAll('.algo').forEach(b=>b.classList.toggle('locked',locked));
  document.getElementById('run').textContent=locked?'Running':'Run';
}

let selected='floodfill', locked=false;
function markSelected(algo){
  selected=algo;
  document.querySelectorAll('.algo').forEach(x=>x.classList.toggle('sel',x.dataset.algo===algo));
}
document.querySelectorAll('.algo').forEach(b=>{b.onclick=async()=>{
  if(locked)return;                       // latched mid-run; Reset to change it
  markSelected(b.dataset.algo);
  const r=await api('/select?algo='+b.dataset.algo);
  if(r&&r.algo)markSelected(r.algo);      // server is the authority (409 -> snap back)
};});
document.getElementById('run').onclick=()=>{ if(usePico){api('/run');} else {MOCK.run();} };
document.getElementById('reset').onclick=()=>{ if(usePico){api('/reset');} else {MOCK.reset();} };

// usePico is decided by a one-time probe: if /state answers, we're on a real
// Pico; if not (opened as a file, or in a preview pane), use the simulator.
let usePico=false, probed=false;
async function api(path){
  try{const r=await fetch(path,{method:'POST'});return await r.json();}catch(e){return null;}
}
async function poll(){
  if(!probed){
    probed=true;
    try{
      const r=await fetch('/state',{cache:'no-store'});
      if(r.ok){ usePico=true; }
    }catch(e){ usePico=false; }
  }
  if(usePico){
    try{
      const r=await fetch('/state',{cache:'no-store'});
      draw(await r.json());
      document.getElementById('conn').textContent='pico · live';
    }catch(e){ document.getElementById('conn').textContent='offline'; }
  }else{
    if(!MOCK.isRunning()) MOCK.run();   // auto-start the demo when no Pico
    draw(MOCK.step());
    document.getElementById('conn').textContent='simulated';
  }
}

// ===== LOCAL MOCK — preview only; real state comes from the Pico =====
const MOCK=(function(){
  const path=[[3,0],[3,1],[2,1],[2,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3]];
  const STEP_MS=700;                    // advance one cell every 0.7 s
  let i=0,t0=Date.now(),lastStep=Date.now(),disc=[],running=false;
  const msgs=['clear ahead','wall on left','wall in front','wall on right','turning'];
  function reset(){i=0;t0=Date.now();lastStep=Date.now();disc=[];running=false;}
  function run(){reset();running=true;}
  function headingBetween(a,b){         // face from cell a -> cell b
    const dr=b[0]-a[0], dc=b[1]-a[1];
    if(dr>0)return'N'; if(dr<0)return'S'; if(dc>0)return'E'; if(dc<0)return'W'; return'N';
  }
  function step(){
    if(running && i<path.length-1 && Date.now()-lastStep>=STEP_MS){ i++; lastStep=Date.now(); }
    const p=path[Math.min(i,path.length-1)];
    if(running && !disc.includes(`${p[0]},${p[1]}`))disc.push(`${p[0]},${p[1]}`);
    const heading = i>0 ? headingBetween(path[i-1],path[i]) : 'N';
    const atGoal = i>=path.length-1 && running;
    // auto-replay: pause a moment at the goal, then restart the walk
    if(atGoal && Date.now()-lastStep>=STEP_MS*3){ reset(); running=true; }
    return {pos:p,heading:heading,discovered:disc.slice(),explored:disc.length,
      elapsed:running?(Date.now()-t0)/1000:0,
      message: !running?'Standing by.' : (atGoal?'Reached goal.':msgs[i%msgs.length])};
  }
  function isRunning(){return running;}
  return {step,reset,run,isRunning};
})();
// draw the empty maze immediately so it's visible before any data
draw({pos:START,heading:'N',discovered:[],explored:0,elapsed:0,message:'Standing by.'});
setInterval(poll,140); poll();
</script>
</body>
</html>
